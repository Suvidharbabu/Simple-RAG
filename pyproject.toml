[project]
name = "rag-project-2"
version = "0.1.0"
description = "Question answering over PDFs with ChromaDB + Groq, falling back to live web search"
readme = "README.md"
authors = [
    { name = "Suvidharbabu", email = "Justinsuvi@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.2",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
rag-project-2 = "rag_project_2:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
